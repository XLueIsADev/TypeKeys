<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TypeKeys</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<meta name="theme-color" content="#0a0a0c" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">

    <header class="toolbar">
      <div class="tb-left">
        <div class="logo" id="logo">TypeKeys</div>
      </div>

      <div class="tb-center">
        <div class="chipset" id="modeChips">
          <button class="chip active" data-mode="time">time</button>
          <button class="chip" data-mode="words">words</button>
          <button class="chip" data-mode="quotes">quotes</button>
          <button class="chip" data-mode="weak">weak</button>
        </div>
        <div class="tb-divider" id="divider1"></div>
        <div class="chipset" id="amountChips">
          <button class="chip" data-amount="15">15</button>
          <button class="chip active" data-amount="30">30</button>
          <button class="chip" data-amount="60">60</button>
          <button class="chip" data-amount="120">120</button>
        </div>
        <div class="tb-divider" id="divider2"></div>
        <div class="chipset" id="modChips">
          <button class="chip toggle" data-mod="punctuation">punctuation</button>
          <button class="chip toggle" data-mod="numbers">numbers</button>
        </div>
      </div>

      <div class="tb-right">
        <button id="restartBtn" class="tb-btn" title="Restart (Esc)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
            <path d="M3 3v5h5" />
          </svg>
        </button>
        <button id="themeToggle" class="tb-btn" title="Toggle theme">
          <svg id="iconSun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
          </svg>
          <svg id="iconMoon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
          </svg>
        </button>
      </div>
    </header>

    <section class="stage" id="stageStart">
      <div class="start-target" id="startTarget">
        <div class="start-line">click here or press any key to start</div>
      </div>

      <div class="home-meta">
        <div class="home-line" id="homeBest">no runs yet</div>
        <div class="home-line dim" id="homeLast"></div>
        <div class="home-tip" id="homeTip"></div>
      </div>
    </section>

    <section class="stage hidden" id="stageTest">
      <div class="live">
        <div class="live-item">
          <span class="live-val" id="liveWpm">0</span>
          <span class="live-lab">wpm</span>
        </div>
        <div class="live-item">
          <span class="live-val" id="liveAcc">100%</span>
          <span class="live-lab">acc</span>
        </div>
        <div class="live-item">
          <span class="live-val" id="liveMistakes">0</span>
          <span class="live-lab">miss</span>
        </div>
        <div class="live-spacer"></div>
        <div class="live-item">
          <span class="live-val" id="liveProgress">0</span>
          <span class="live-lab" id="progressLabel">/ 30</span>
        </div>
      </div>

      <div class="test-area" id="testArea">
        <div class="text-display" id="textDisplay"></div>
        <div id="caret"></div>
        <input id="hiddenInput" class="hidden-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
        <div class="focus-overlay" id="focusOverlay">click to focus</div>
      </div>
    </section>

    <section class="stage hidden" id="stageResults">
      <div class="res-top">
        <div class="res-block">
          <span class="res-big" id="resWpm">0</span>
          <span class="res-lab">wpm</span>
        </div>
        <div class="res-block">
          <span class="res-big" id="resAcc">0%</span>
          <span class="res-lab">accuracy</span>
        </div>
      </div>

      <canvas id="wpmChart" width="1200" height="200"></canvas>

      <div class="res-grid">
        <div class="res-cell">
          <span class="res-val" id="resRaw">0</span>
          <span class="res-key">raw</span>
        </div>
        <div class="res-cell">
          <span class="res-val" id="resMistakes">0</span>
          <span class="res-key">mistakes</span>
        </div>
        <div class="res-cell">
          <span class="res-val" id="resChars">0</span>
          <span class="res-key">characters</span>
        </div>
        <div class="res-cell">
          <span class="res-val" id="resTime">0s</span>
          <span class="res-key">time</span>
        </div>
      </div>

      <div class="weak-panel" id="weakPanel">
        <div class="weak-head">
          <span class="weak-title">your weak keys</span>
          <span class="weak-sub" id="weakSub">practice the letters you keep missing</span>
        </div>
        <div class="weak-grid" id="weakGrid"></div>
        <div class="weak-note" id="weakNote"></div>
      </div>

      <div class="res-actions">
        <button class="btn-primary" id="againBtn">try again</button>
        <button class="btn-ghost" id="practiceWeakBtn">practice weaknesses</button>
        <button class="btn-ghost" id="newTestBtn">new test</button>
      </div>
    </section>

    <footer class="footer">
      <span><kbd>tab</kbd> new test <span class="sep">·</span> <kbd>esc</kbd> restart</span>
      <span class="dim">
        built by xlueiasdev
        <span class="sep">·</span>
        <span id="resetStats">reset stats</span>
      </span>
    </footer>

  </main>

  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
